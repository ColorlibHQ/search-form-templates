<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Colrolib Templates">
    <meta name="author" content="colorlib.com">
    <meta name="keywords" content="Colrolib Templates">

    <!-- Title Page-->
    <title>Au Form Wizard</title>

    	<link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page-wrapper bg-color-1 p-t-395 p-b-120">
        <div class="wrapper wrapper--w1070">
            <div class="cl-card card-7">
                <div class="cl-card-body">
                    <form class="form" method="POST" action="#">
                        <div class="cl-input-group input--large">
                            <label class="label">going to</label>
                            <input class="input--style-1" type="text" placeholder="Destination, hotel name" name="going">
                        </div>
                        <div class="cl-input-group input--medium">
                            <label class="label">Check-In</label>
                            <input type="date" class="input--style-1" name="checkin" id="input-start">
                        </div>
                        <div class="cl-input-group input--medium">
                            <label class="label">Check-Out</label>
                            <input type="date" class="input--style-1" name="checkout" id="input-end">
                        </div>
                        <div class="cl-input-group input--medium">
                            <label class="label">guests</label>
                            <div class="input-group-icon js-number-input">
                                <div class="icon-con">
                                    <span class="plus">+</span>
                                    <span class="minus">-</span>
                                </div>
                                <input class="input--style-1 quantity" type="text" name="guests" value="2 Guests">
                            </div>
                        </div>
                        <button class="btn-submit" type="submit">search</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

	<script src="js/snippet.js"></script>
</body><!-- This templates was made by Colorlib (https://colorlib.com) -->

</html>
<!-- end document-->
