<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Colrolib Templates">
    <meta name="author" content="Colrolib">
    <meta name="keywords" content="Colrolib Templates">

    <!-- Title Page-->
    <title>Au Form Wizard</title>

    	<link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="page-wrapper bg-img-1 p-t-165 p-b-100">
        <div class="wrapper wrapper--w720">
            <div class="cl-card card-3">
                <div class="cl-card-body">
                    <ul class="tab-list">
                        <li class="tab-list__item cl-active">
                            <a class="tab-list__link" href="#tab1" data-toggle="tab">hotels</a>
                        </li>
                        <li class="tab-list__item">
                            <a class="tab-list__link" href="#tab2" data-toggle="tab">car</a>
                        </li>
                        <li class="tab-list__item">
                            <a class="tab-list__link" href="#tab3" data-toggle="tab">flight</a>
                        </li>
                    </ul>
                    <div class="cl-tab-content">
                        <div class="cl-tab-pane cl-active" id="tab1">
                            <form method="POST" action="#">
                                <div class="cl-input-group">
                                    <label class="label">Going to</label>
                                    <input class="input--style-1" type="text" name="address" placeholder="Destination, hotel name" required="required">
                                    <i class="zmdi zmdi-pin input-group-symbol"><svg class="cl-icon" viewBox="0 0 299 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M299 256Q299 225 283.5 184.5Q268 144 246.0 109.5Q224 75 202.0 44.5Q180 14 165 -4L149 -21Q143 -15 133.0 -3.0Q123 9 97.5 43.5Q72 78 52.0 110.5Q32 143 16.0 184.0Q0 225 0 256Q0 318 43.5 361.5Q87 405 149.0 405.0Q211 405 255.0 361.5Q299 318 299 256ZM111.5 218.5Q127 203 149.0 203.0Q171 203 187.0 218.5Q203 234 203.0 256.0Q203 278 187.0 293.5Q171 309 149.0 309.0Q127 309 111.5 293.5Q96 278 96.0 256.0Q96 234 111.5 218.5Z"/></g></svg></i>
                                </div>
                                <div class="cl-row row-space">
                                    <div class="cl-col-2">
                                        <div class="cl-input-group">
                                            <label class="label">check-in</label>
                                            <input type="date" class="input--style-1" name="check-in" id="input-start">
                                            <i class="zmdi zmdi-calendar-alt input-group-symbol"><svg class="cl-icon" viewBox="0 0 384 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M341 384Q359 384 371.5 371.5Q384 359 384 341V43Q384 25 371.5 12.5Q359 0 341 0H43Q25 0 12.5 12.5Q0 25 0 43V341Q0 359 12.5 371.5Q25 384 43 384H64V427H107V384H277V427H320V384ZM341 43V277H43V43ZM85 235H192V128H85Z"/></g></svg></i>
                                        </div>
                                    </div>
                                    <div class="cl-col-2">
                                        <div class="cl-input-group">
                                            <label class="label">check-out</label>
                                            <input type="date" class="input--style-1" name="check-out" id="input-end">
                                            <i class="zmdi zmdi-calendar-alt input-group-symbol"><svg class="cl-icon" viewBox="0 0 384 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M341 384Q359 384 371.5 371.5Q384 359 384 341V43Q384 25 371.5 12.5Q359 0 341 0H43Q25 0 12.5 12.5Q0 25 0 43V341Q0 359 12.5 371.5Q25 384 43 384H64V427H107V384H277V427H320V384ZM341 43V277H43V43ZM85 235H192V128H85Z"/></g></svg></i>
                                        </div>
                                    </div>
                                </div>
                                <div class="cl-input-group">
                                    <label class="label">travellers</label>
                                    <i class="zmdi zmdi-account-add input-group-symbol"><svg class="cl-icon" viewBox="0 0 469 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M359.0 217.0Q334 192 298.5 192.0Q263 192 238.0 217.0Q213 242 213.0 277.5Q213 313 238.0 338.0Q263 363 298.5 363.0Q334 363 359.0 338.0Q384 313 384.0 277.5Q384 242 359.0 217.0ZM107 235H171V192H107V128H64V192H0V235H64V299H107ZM469 64V21H128V64Q128 90 159.5 110.5Q191 131 229.0 140.0Q267 149 298.5 149.0Q330 149 368.0 140.0Q406 131 437.5 110.5Q469 90 469 64Z"/></g></svg></i>
                                    <div class="input-group-icon" id="js-select-special">
                                        <input class="input--style-1" type="text" name="traveller" value="1 Adult, 0 Children, 1 Room" readonly id="info">
                                        <i class="zmdi zmdi-chevron-down input-icon"><svg class="cl-icon" viewBox="0 0 256 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M226 265 256 235 128 107 0 235 30 265 128 167Z"/></g></svg></i>
                                    </div>
                                    <div class="dropdown-select">
                                        <ul class="list-room">
                                            <li class="list-room__item">
                                                <span class="list-room__name">Room 1</span>
                                                <ul class="list-person">
                                                    <li class="list-person__item">
                                                        <span class="name">Adults</span>
                                                        <div class="quantity quantity1">
                                                            <span class="minus">-</span>
                                                            <input class="inputQty" type="number" min="0" value="1">
                                                            <span class="plus">+</span>
                                                        </div>
                                                    </li>
                                                    <li class="list-person__item">
                                                        <span class="name">Children</span>
                                                        <div class="quantity quantity2">
                                                            <span class="minus">-</span>
                                                            <input class="inputQty" type="number" min="0" value="0">
                                                            <span class="plus">+</span>
                                                        </div>
                                                    </li>
                                                </ul>
                                            </li>
                                        </ul>
                                        <div class="list-room__footer">
                                            <a href="#" id="btn-add-room">Add room</a>
                                        </div>
                                    </div>
                                </div>
                                <div class="checkbox-row">
                                    <label class="checkbox-container m-r-45">Add a flight
                                        <input type="checkbox" checked="checked" name="add-flight">
                                        <span class="checkmark"></span>
                                    </label>
                                    <label class="checkbox-container">Add a car
                                        <input type="checkbox" name="add-car">
                                        <span class="checkmark"></span>
                                    </label>
                                </div>
                                <button class="btn-submit" type="submit">search</button>
                            </form>
                        </div>
                        <div class="cl-tab-pane" id="tab2">
                            <form method="POST" action="#">
                                <div class="cl-input-group">
                                    <label class="label">location:</label>
                                    <input class="input--style-1" type="text" name="location" placeholder="Destination, hotel name" required="required">
                                    <i class="zmdi zmdi-pin input-group-symbol"><svg class="cl-icon" viewBox="0 0 299 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M299 256Q299 225 283.5 184.5Q268 144 246.0 109.5Q224 75 202.0 44.5Q180 14 165 -4L149 -21Q143 -15 133.0 -3.0Q123 9 97.5 43.5Q72 78 52.0 110.5Q32 143 16.0 184.0Q0 225 0 256Q0 318 43.5 361.5Q87 405 149.0 405.0Q211 405 255.0 361.5Q299 318 299 256ZM111.5 218.5Q127 203 149.0 203.0Q171 203 187.0 218.5Q203 234 203.0 256.0Q203 278 187.0 293.5Q171 309 149.0 309.0Q127 309 111.5 293.5Q96 278 96.0 256.0Q96 234 111.5 218.5Z"/></g></svg></i>
                                </div>
                                <div class="cl-row row-space">
                                    <div class="cl-col-2">
                                        <div class="cl-input-group">
                                            <label class="label">driver age:</label>
                                            <i class="zmdi zmdi-calendar-alt input-group-symbol"><svg class="cl-icon" viewBox="0 0 384 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M341 384Q359 384 371.5 371.5Q384 359 384 341V43Q384 25 371.5 12.5Q359 0 341 0H43Q25 0 12.5 12.5Q0 25 0 43V341Q0 359 12.5 371.5Q25 384 43 384H64V427H107V384H277V427H320V384ZM341 43V277H43V43ZM85 235H192V128H85Z"/></g></svg></i>
                                            <div class="rs-select2 js-select-simple select--no-search">
                                                <span class="cl-select-shell cl-select-full select2 select2-container select2-container--default" dir="ltr"><span class="selection"><span class="select2-selection select2-selection--single" aria-haspopup="true"><select name="driver-age" class="cl-select cl-sel-0">
                                                    <option>23</option>
                                                    <option>24</option>
                                                    <option selected="selected">25</option>
                                                    <option>26</option>
                                                </select><span class="select2-selection__arrow" role="presentation"><b role="presentation"></b></span></span></span></span>
                                                <div class="select-dropdown"></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="cl-col-2">
                                        <div class="cl-input-group">
                                            <label class="label">car group:</label>
                                            <i class="zmdi zmdi-calendar-alt input-group-symbol"><svg class="cl-icon" viewBox="0 0 384 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M341 384Q359 384 371.5 371.5Q384 359 384 341V43Q384 25 371.5 12.5Q359 0 341 0H43Q25 0 12.5 12.5Q0 25 0 43V341Q0 359 12.5 371.5Q25 384 43 384H64V427H107V384H277V427H320V384ZM341 43V277H43V43ZM85 235H192V128H85Z"/></g></svg></i>
                                            <div class="rs-select2 js-select-simple select--no-search">
                                                <span class="cl-select-shell cl-select-full select2 select2-container select2-container--default" dir="ltr"><span class="selection"><span class="select2-selection select2-selection--single" aria-haspopup="true"><select name="car-group" class="cl-select cl-sel-1">
                                                    <option selected="selected">Group S-car</option>
                                                    <option>Group 1</option>
                                                    <option>Group 2</option>
                                                    <option>Group 3</option>
                                                </select><span class="select2-selection__arrow" role="presentation"><b role="presentation"></b></span></span></span></span>
                                                <div class="select-dropdown"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="cl-row row-space">
                                    <div class="cl-col-2">
                                        <div class="cl-input-group">
                                            <label class="label">pick up:</label>
                                            <i class="zmdi zmdi-calendar-alt input-group-symbol"><svg class="cl-icon" viewBox="0 0 384 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M341 384Q359 384 371.5 371.5Q384 359 384 341V43Q384 25 371.5 12.5Q359 0 341 0H43Q25 0 12.5 12.5Q0 25 0 43V341Q0 359 12.5 371.5Q25 384 43 384H64V427H107V384H277V427H320V384ZM341 43V277H43V43ZM85 235H192V128H85Z"/></g></svg></i>
                                            <input type="date" class="input--style-1 js-single-datepicker" name="pickup">
                                            <div class="dropdown-datepicker" id="dropdown-datepicker1"></div>
                                        </div>
                                    </div>
                                    <div class="cl-col-2">
                                        <div class="cl-input-group">
                                            <label class="label">time:</label>
                                            <i class="zmdi zmdi-time input-group-symbol"><svg class="cl-icon" viewBox="0 0 427 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M62.5 342.5Q125 405 213.5 405.0Q302 405 364.5 342.5Q427 280 427.0 192.0Q427 104 364.5 41.5Q302 -21 213.5 -21.0Q125 -21 62.5 41.5Q0 104 0.0 192.0Q0 280 62.5 342.5ZM93.0 71.0Q143 21 213.5 21.0Q284 21 334.0 71.0Q384 121 384.0 192.0Q384 263 334.0 313.0Q284 363 213.5 363.0Q143 363 93.0 313.0Q43 263 43.0 192.0Q43 121 93.0 71.0ZM224 299V187L320 130L304 103L192 171V299Z"/></g></svg></i>
                                            <div class="rs-select2 js-select-simple select--no-search">
                                                <span class="cl-select-shell cl-select-full select2 select2-container select2-container--default" dir="ltr"><span class="selection"><span class="select2-selection select2-selection--single" aria-haspopup="true"><select name="time-pickup" class="cl-select cl-sel-2">
                                                    <option selected="selected">10:00 AM</option>
                                                    <option>5:00 AM</option>
                                                    <option>6:00 AM</option>
                                                    <option>7:00 AM</option>
                                                </select><span class="select2-selection__arrow" role="presentation"><b role="presentation"></b></span></span></span></span>
                                                <div class="select-dropdown"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="cl-row row-space">
                                    <div class="cl-col-2">
                                        <div class="cl-input-group">
                                            <label class="label">drop off:</label>
                                            <i class="zmdi zmdi-calendar-alt input-group-symbol"><svg class="cl-icon" viewBox="0 0 384 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M341 384Q359 384 371.5 371.5Q384 359 384 341V43Q384 25 371.5 12.5Q359 0 341 0H43Q25 0 12.5 12.5Q0 25 0 43V341Q0 359 12.5 371.5Q25 384 43 384H64V427H107V384H277V427H320V384ZM341 43V277H43V43ZM85 235H192V128H85Z"/></g></svg></i>
                                            <input type="date" class="input--style-1 js-single-datepicker" name="dropoff">
                                            <div class="dropdown-datepicker" id="dropdown-datepicker2"></div>
                                        </div>
                                    </div>
                                    <div class="cl-col-2">
                                        <div class="cl-input-group">
                                            <label class="label">time:</label>
                                            <i class="zmdi zmdi-time input-group-symbol"><svg class="cl-icon" viewBox="0 0 427 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M62.5 342.5Q125 405 213.5 405.0Q302 405 364.5 342.5Q427 280 427.0 192.0Q427 104 364.5 41.5Q302 -21 213.5 -21.0Q125 -21 62.5 41.5Q0 104 0.0 192.0Q0 280 62.5 342.5ZM93.0 71.0Q143 21 213.5 21.0Q284 21 334.0 71.0Q384 121 384.0 192.0Q384 263 334.0 313.0Q284 363 213.5 363.0Q143 363 93.0 313.0Q43 263 43.0 192.0Q43 121 93.0 71.0ZM224 299V187L320 130L304 103L192 171V299Z"/></g></svg></i>
                                            <div class="rs-select2 js-select-simple select--no-search">
                                                <span class="cl-select-shell cl-select-full select2 select2-container select2-container--default" dir="ltr"><span class="selection"><span class="select2-selection select2-selection--single" aria-haspopup="true"><select name="time-dropoff" class="cl-select cl-sel-3">
                                                    <option selected="selected">10:00 AM</option>
                                                    <option>5:00 AM</option>
                                                    <option>6:00 AM</option>
                                                    <option>7:00 AM</option>
                                                </select><span class="select2-selection__arrow" role="presentation"><b role="presentation"></b></span></span></span></span>
                                                <div class="select-dropdown"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <button class="btn-submit m-t-15" type="submit">search</button>
                            </form>
                        </div>
                        <div class="cl-tab-pane" id="tab3">
                            <form method="POST" action="#">
                                <div class="cl-input-group">
                                    <label class="label">origin</label>
                                    <i class="zmdi zmdi-pin input-group-symbol"><svg class="cl-icon" viewBox="0 0 299 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M299 256Q299 225 283.5 184.5Q268 144 246.0 109.5Q224 75 202.0 44.5Q180 14 165 -4L149 -21Q143 -15 133.0 -3.0Q123 9 97.5 43.5Q72 78 52.0 110.5Q32 143 16.0 184.0Q0 225 0 256Q0 318 43.5 361.5Q87 405 149.0 405.0Q211 405 255.0 361.5Q299 318 299 256ZM111.5 218.5Q127 203 149.0 203.0Q171 203 187.0 218.5Q203 234 203.0 256.0Q203 278 187.0 293.5Q171 309 149.0 309.0Q127 309 111.5 293.5Q96 278 96.0 256.0Q96 234 111.5 218.5Z"/></g></svg></i>
                                    <input class="input--style-1" type="text" name="origin" placeholder="City or airport" required="required">
                                </div>
                                <div class="cl-input-group">
                                    <label class="label">destination:</label>
                                    <i class="zmdi zmdi-pin input-group-symbol"><svg class="cl-icon" viewBox="0 0 299 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M299 256Q299 225 283.5 184.5Q268 144 246.0 109.5Q224 75 202.0 44.5Q180 14 165 -4L149 -21Q143 -15 133.0 -3.0Q123 9 97.5 43.5Q72 78 52.0 110.5Q32 143 16.0 184.0Q0 225 0 256Q0 318 43.5 361.5Q87 405 149.0 405.0Q211 405 255.0 361.5Q299 318 299 256ZM111.5 218.5Q127 203 149.0 203.0Q171 203 187.0 218.5Q203 234 203.0 256.0Q203 278 187.0 293.5Q171 309 149.0 309.0Q127 309 111.5 293.5Q96 278 96.0 256.0Q96 234 111.5 218.5Z"/></g></svg></i>
                                    <input class="input--style-1" type="text" name="destination" placeholder="City or airport" required="required">
                                </div>
                                <div class="cl-row row-space">
                                    <div class="cl-col-2">
                                        <div class="cl-input-group">
                                            <label class="label">Departing</label>
                                            <i class="zmdi zmdi-calendar-alt input-group-symbol"><svg class="cl-icon" viewBox="0 0 384 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M341 384Q359 384 371.5 371.5Q384 359 384 341V43Q384 25 371.5 12.5Q359 0 341 0H43Q25 0 12.5 12.5Q0 25 0 43V341Q0 359 12.5 371.5Q25 384 43 384H64V427H107V384H277V427H320V384ZM341 43V277H43V43ZM85 235H192V128H85Z"/></g></svg></i>
                                            <input type="date" class="input--style-1" name="check-in" id="input-start-2">
                                        </div>
                                    </div>
                                    <div class="cl-col-2">
                                        <div class="cl-input-group">
                                            <label class="label">returning</label>
                                            <i class="zmdi zmdi-calendar-alt input-group-symbol"><svg class="cl-icon" viewBox="0 0 384 512" style="vertical-align:-0.125em" aria-hidden="true" focusable="false"><g transform="translate(0,449) scale(1,-1)"><path d="M341 384Q359 384 371.5 371.5Q384 359 384 341V43Q384 25 371.5 12.5Q359 0 341 0H43Q25 0 12.5 12.5Q0 25 0 43V341Q0 359 12.5 371.5Q25 384 43 384H64V427H107V384H277V427H320V384ZM341 43V277H43V43ZM85 235H192V128H85Z"/></g></svg></i>
                                            <input type="date" class="input--style-1" name="check-out" id="input-end-2">
                                        </div>
                                    </div>
                                </div>
                                <div class="radio-row">
                                    <label class="radio-container m-r-45">First Class
                                        <input type="radio" name="class">
                                        <span class="radio-checkmark"></span>
                                    </label>
                                    <label class="radio-container m-r-45">Business
                                        <input type="radio" name="class">
                                        <span class="radio-checkmark"></span>
                                    </label>
                                    <label class="radio-container">Economy
                                        <input type="radio" checked="checked" name="class">
                                        <span class="radio-checkmark"></span>
                                    </label>
                                </div>
                                <button class="btn-submit" type="submit">search</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

	<script src="js/snippet.js"></script>
